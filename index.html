<!DOCTYPE html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Хөдөлдөг уушиг — анатоми ба Slow motion</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b1220;--pn:#111a2e;--bd:#24324f;--tx:#e2e8f0;--mu:#8da0bd;--ac:#38bdf8}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef2f8;--pn:#fff;--bd:#cbd5e1;--tx:#0f172a;--mu:#51627f;--ac:#0369a1}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 'Segoe UI',system-ui,Arial,sans-serif}
header{padding:10px 14px;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--bd)}header b{font-size:15px;color:var(--ac)}header span{color:var(--mu);font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px;padding:10px}
@media(max-width:820px){main{grid-template-columns:1fr}}
canvas{display:block;width:100%;border-radius:10px;border:1px solid var(--bd)}
#ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.b{padding:5px 11px;border-radius:18px;border:1px solid var(--bd);background:var(--pn);color:var(--mu);cursor:pointer;font-size:12px}
.b.on{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
#sb{flex:1;min-width:140px;accent-color:#38bdf8}
aside{display:flex;flex-direction:column;gap:8px}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:10px}
.pn h4{margin:0 0 6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
#chips,#ages{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{padding:6px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--mu);cursor:pointer;font-size:11px;text-align:left}
.chip.on{color:#fff;border-color:currentColor;background:rgba(56,189,248,.14)}
#card b{display:block;margin-bottom:4px;font-size:14px}#card p{margin:0 0 6px;color:var(--mu)}
.r{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);font-size:12px}.r span:first-child{color:var(--mu)}.r span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);margin-top:6px}label input[type=range]{flex:1;accent-color:#38bdf8}
</style></head><body>
<header><b>🫁 Хөдөлдөг уушиг</b><span>Уушгийн анатоми · Амьсгалын аппарат · Альвеол · Slow motion</span></header>
<main>
<section style="min-width:0"><div style="overflow-x:auto"><canvas id="c"></canvas></div>
<div id="ctl"><button id="pl" class="b on">⏸ Зогсоох</button><span id="sp"></span><input id="sb" type="range" min="0" max="1000" value="0" title="Амьсгалын мөчлөг"></div></section>
<aside>
<div class="pn"><h4>Насны бүлэг</h4><div id="ages"></div><div id="ageinfo"></div></div>
<div class="pn"><h4>Амьсгалын үе шат</h4><div id="chips"></div></div>
<div class="pn" id="card"></div>
<div class="pn"><h4>Хэмжилт</h4>
<div class="r"><span>Агаарын хэмжээ</span><span id="rV"></span></div>
<div class="r"><span>Урсгал</span><span id="rF"></span></div>
<div class="r"><span>Paw (гуурс)</span><span id="rPaw"></span></div>
<div class="r"><span>Palv (альвеол)</span><span id="rPalv"></span></div>
<div class="r"><span>Ppl (гялтан)</span><span id="rPpl"></span></div>
<div class="r"><span>Ptp = Palv − Ppl</span><span id="rPtp"></span></div></div>
<div class="pn"><h4>Тохиргоо</h4>
<button class="b" id="vt">Горим: өөрөө амьсгалах</button>
<label>TV <input id="tv" type="range" min="15" max="900" step="5" value="500"><span id="tvv">500</span></label>
<label>PEEP <input id="pe" type="range" min="0" max="12" value="5"><span id="pev">5</span></label>
<label>RR <input id="rr" type="range" min="6" max="30" value="14"><span id="rrv">14</span></label>
<label><input type="checkbox" id="stp"> Үе шат бүрт автоматаар зогсох</label></div>
</aside></main>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
const S={rr:14,vent:false,speed:1,play:true,u:0,stop:false,tv:500,peep:5,cmp:50,sw:3,res:1,k:1,ch:1,bag:1,sat:1,lt:0,ar:1,ad:250,an:'~480 сая',hr:72,bagL:'2–3 л'};
let TI=.4,PE=.55,KK=3.2;
const VW=1260,VH=600;let sc=1,V=0,F=0;
function resize(){const w=Math.max(cv.parentNode.clientWidth,900),d=devicePixelRatio||1;cv.style.width=w+'px';cv.style.height=w*VH/VW+'px';cv.width=w*d;cv.height=w*VH/VW*d;sc=w*d/VW}
addEventListener('resize',resize);resize();
const ST=[[0,.15],[.15,.4],[.4,.55],[.55,1]],BC=['#38bdf8','#818cf8','#34d399','#f59e0b'];
const TX=[['1 · Инспираци эхлэх','Диафрагм агшиж доош хөдөлнө, хавирга хоорондын булчин хавирга өргөнө. Цээжний хөндий томорч гялтангийн даралт Ppl улам сөрөг болно (хэмжилтээс харна уу).','Аппаратын горимд цээж өөрөө тэлэхгүй: аппарат агаарыг эерэг даралтаар түлхэнэ.'],
['2 · Даралтын тархалт','Альвеолын даралт агаар мандлаас бага (Palv < 0) болж, даралтын зөрүүгээр агаар трахей → гол гуурс → салаа гуурсаар дамжин бүх дэлбээнд тархана. Эхлээд дээд, дараа нь доод дэлбээ дүүрнэ.','Аппаратын горимд Paw > Palv: даралт гуурснаас альвеол руу буурч тархана.'],
['3 · Хийн солилцоо','Альвеол дүүрч, O₂ нимгэн мембраныг диффузээр дамжин капилляр дахь улаан эс рүү шилжинэ. Эсрэг чиглэлд CO₂ цуснаас альвеол руу гарч хуримтлагдана.','Аппаратын горимд PEEP альвеолыг задгай байлгаж солилцоог дэмжинэ.'],
['4 · Экспираци — CO₂ гарах','Диафрагм суларч, уушиг уян чанараараа буцан хумигдана. Palv > 0 болж CO₂-той агаар гуурсаар дамжин трахейгаар гадагш гарна (идэвхгүй процесс).','Аппаратын горимд экспираци мөн идэвхгүй: Paw PEEP хүртэл буурна.']];
const Vf=u=>{if(u<TI)return .5*(1-Math.cos(Math.PI*u/TI));if(u<PE)return 1;const s=(u-PE)/(1-PE);return(Math.exp(-KK*s)-Math.exp(-KK))/(1-Math.exp(-KK))};
const Ff=u=>(Vf(Math.min(u+.004,1))-Vf(Math.max(u-.004,0)))/.008/4;
const Pr=u=>{const v=Vf(u),f=Ff(u);const dp=S.tv/S.cmp;return S.vent?{ppl:-5+4*v,palv:S.peep+dp*v,paw:S.peep+dp*v+3*S.res*f}:{ppl:-5-S.sw*v,palv:-1.2*S.res*f,paw:-.6*S.res*f}};
const stageOf=u=>ST.findIndex(s=>u>=s[0]&&u<s[1]);
const T=(x,y)=>[259+(x-259)*(1+.075*S.ch*V),y+(y-95)*.07*S.ch*V];

function grow(par,x,y,a,len,w,d,lu){let ex,ey,k=1;const L=LU[lu];
 for(let i=0;i<8;i++){ex=x+Math.cos(a)*len*k;ey=y+Math.sin(a)*len*k;if(((ex-L.cx)/L.rx)**2+((ey-L.cy)/L.ry)**2<.62)break;k*=.8}
 segs.push({x1:x,y1:y,x2:ex,y2:ey,w,d,par});const id=segs.length-1;
 if(d>=6){leaves.push(id);return}
 const sp=.55-d*.03,dn=(Math.PI/2-a)*.15;
 grow(id,ex,ey,a-sp+dn,len*.86,w*.74,d+1,lu);grow(id,ex,ey,a+sp+dn,len*.86,w*.74,d+1,lu)}
segs.push({x1:259,y1:28,x2:259,y2:150,w:13,d:0,par:-1});
(function(){const P=Math.PI/2;
 let a=P+.95;segs.push({x1:259,y1:150,x2:259+55*Math.cos(a),y2:150+55*Math.sin(a),w:9,d:1,par:0});
 let s=segs[1];[P+1.9,P+1.1,P+.25].forEach(b=>grow(1,s.x2,s.y2,b,58,4.2,2,0));
 a=P-1;segs.push({x1:259,y1:150,x2:259+70*Math.cos(a),y2:150+70*Math.sin(a),w:9,d:1,par:0});
 s=segs[segs.length-1];const id=segs.length-1;[P-1.9,P-.3].forEach(b=>grow(id,s.x2,s.y2,b,64,4.2,2,1))})();
const paths=leaves.map(id=>{const ch=[];let i=id;while(i>=0){ch.push(i);i=segs[i].par}ch.reverse();const p=[[segs[ch[0]].x1,segs[ch[0]].y1]];ch.forEach(k=>p.push([segs[k].x2,segs[k].y2]));return p});
const onPath=(p,f)=>{const n=p.length-1,t=Math.min(f,.999)*n,i=Math.floor(t),q=t-i;return T(p[i][0]+(p[i+1][0]-p[i][0])*q,p[i][1]+(p[i+1][1]-p[i][1])*q)};
// ---- shapes ----
const TEX=[];for(let i=0,k=7;i<380;i++){k=(k*9301+49297)%233280;const a=k/233280;k=(k*9301+49297)%233280;TEX.push([100+a*315,95+k/233280*355])}
const R_OUT=[[232,92],[170,98],[128,150],[108,230],[104,320],[115,400],[150,438],[215,448],[252,425],[256,350],[254,250],[252,160],[244,112]];
const L_OUT=[[284,95],[340,100],[385,150],[408,235],[412,330],[400,405],[360,440],[312,450],[278,428],[288,390],[300,352],[280,312],[268,245],[268,165],[276,112]];
const LOBES=[[[80,70],[270,70],[270,218],[254,218],[200,230],[108,236],[80,238]],[[80,236],[108,236],[200,230],[254,218],[270,218],[270,306],[254,306],[190,320],[106,318],[80,318]],[[80,318],[106,318],[190,320],[254,306],[270,306],[270,470],[80,470]],
[[260,70],[430,70],[430,312],[411,310],[330,288],[268,262],[260,262]],[[260,262],[268,262],[330,288],[411,310],[430,312],[430,470],[260,470]]];
const FIS=[[[254,218],[200,230],[108,236]],[[254,306],[190,320],[106,318]],[[268,262],[330,288],[411,310]]];
function blob(P){const q=P.map(p=>T(p[0],p[1])),n=q.length;g.beginPath();g.moveTo((q[n-1][0]+q[0][0])/2,(q[n-1][1]+q[0][1])/2);
 for(let i=0;i<n;i++){const a=q[i],b=q[(i+1)%n];g.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}g.closePath()}
function poly(P){g.beginPath();P.forEach((p,i)=>{const q=T(p[0],p[1]);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])});g.closePath()}
function line(x1,y1,x2,y2,c,w){g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function txt(s,x,y,c,sz,al){g.fillStyle=c;g.font=(sz||10)+'px Segoe UI,Arial';g.textAlign=al||'center';g.fillText(s,x,y)}
function arrow(x,y,dx,dy,c){g.fillStyle=c;g.save();g.translate(x,y);g.rotate(Math.atan2(dy,dx));g.beginPath();g.moveTo(10,0);g.lineTo(-6,-7);g.lineTo(-6,7);g.fill();g.restore()}
// ---- particles ----
let P=[],spawn=0,M=[],mAcc=0,rbc=0;
function drawBody(){
 // ribs + sternum
 g.lineCap='round';g.fillStyle='rgba(226,232,240,.08)';g.fillRect(253,100,12,240);
 for(let i=0;i<7;i++)for(const s of[-1,1]){const y=112+i*50;g.beginPath();g.moveTo(259+s*14,y+22);g.quadraticCurveTo(259+s*130,y-26-8*V,259+s*(190+12*V),y+14+i*3-5*V);g.strokeStyle='rgba(226,232,240,.08)';g.lineWidth=7;g.stroke();g.strokeStyle='rgba(226,232,240,.14)';g.lineWidth=1.2;g.stroke()}
 // diaphragm
 const h=38*(1-.6*V),y0=452+25*V+.8*h-6;
 g.beginPath();g.moveTo(30,600);g.lineTo(30,y0+10);g.quadraticCurveTo(145,y0-h*1.6,259,y0+6);g.quadraticCurveTo(373,y0-h*1.6,488,y0+10);g.lineTo(488,600);g.closePath();
 const gr=g.createLinearGradient(0,y0-h,0,y0+60);gr.addColorStop(0,'#9a3b4d');gr.addColorStop(1,'#4a1c2a');g.fillStyle=gr;g.fill();g.strokeStyle='#d46a82';g.lineWidth=2;g.stroke();
 txt('Диафрагм',259,y0+38,'#f5c0cb',11);
 const d=F>.05?1:F<-.05?-1:0;if(d){const c=d>0?'#38bdf8':'#f59e0b';for(const x of[150,370])arrow(x,y0+16,0,d,c);
  for(let i=0;i<3;i++)for(const s of[-1,1])arrow(259+s*(200+12*V),160+i*90,s*d,0,c)}
}
function drawLungs(){
 g.fillStyle='rgba(120,40,60,.4)';g.beginPath();g.roundRect(248,100,32,340,10);g.fill();
 {const h=T(288,345);g.save();g.translate(h[0],h[1]);g.rotate(-.35);g.beginPath();g.ellipse(0,0,36,56,0,0,6.29);const hg=g.createLinearGradient(-30,-50,30,50);hg.addColorStop(0,'#c0394f');hg.addColorStop(1,'#6b1425');g.fillStyle=hg;g.fill();g.strokeStyle='#f0768b';g.lineWidth=1.5;g.stroke();g.restore()}
 const pa=Pr(S.u).palv,al=Math.min(.45,Math.abs(pa)/(S.vent?18:2.5)*.45),oc=pa<0?'56,189,248':'251,146,60';
 [[R_OUT,[0,1,2]],[L_OUT,[3,4]]].forEach(([O,ls])=>{
  g.save();blob(O);g.shadowColor='rgba(244,114,182,.5)';g.shadowBlur=6+14*V;g.fillStyle='#b4506a';g.fill();g.restore();
  g.save();blob(O);g.clip();
  ls.forEach((l,i)=>{poly(LOBES[l]);g.fillStyle=`hsl(${352+l*2},${(52+10*V)*S.sat}%,${50+9*V-l*2.5+S.lt}%)`;g.fill()});
  g.fillStyle=`rgba(${oc},${al})`;g.fillRect(0,0,VW,VH);
  g.fillStyle='rgba(255,235,240,.2)';g.beginPath();TEX.forEach(p=>{const q=T(p[0],p[1]);g.moveTo(q[0]+1.4,q[1]);g.arc(q[0],q[1],1.4,0,6.29)});g.fill();
  const gl=g.createRadialGradient(...T(O===R_OUT?170:350,170),5,...T(O===R_OUT?170:350,260),230);gl.addColorStop(0,'rgba(255,255,255,.16)');gl.addColorStop(1,'rgba(0,0,0,.25)');g.fillStyle=gl;g.fillRect(0,0,VW,VH);
  g.restore();blob(O);g.strokeStyle='rgba(255,200,215,.8)';g.lineWidth=2;g.stroke()});
 g.strokeStyle='rgba(110,25,55,.65)';g.lineWidth=1.8;
 FIS.forEach(f=>{g.beginPath();f.forEach((p,i)=>{const q=T(p[0],p[1]);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])});g.stroke()});
 g.lineCap='round';
 const vl=(a,b,c,w)=>{const p=T(a[0],a[1]),q=T(b[0],b[1]);line(p[0],p[1],q[0],q[1],c,w)};
 vl([280,300],[268,236],'rgba(90,120,255,.55)',7);vl([268,236],[226,200],'rgba(90,120,255,.5)',4);vl([268,236],[306,214],'rgba(90,120,255,.5)',4);vl([222,238],[262,290],'rgba(200,40,50,.5)',3.5);vl([308,250],[290,292],'rgba(200,40,50,.5)',3.5);
 // vessels + bronchi
 segs.forEach((s,i)=>{if(!i)return;const[a,b]=T(s.x1,s.y1),[c,e]=T(s.x2,s.y2),dx=e-b,dy=a-c,l=Math.hypot(dx,dy)||1,nx=dx/l,ny=dy/l,o=s.w*.55+1.6,w=Math.max(.8,s.w*.38);
  if(s.d>=1){line(a+nx*o,b+ny*o,c+nx*o,e+ny*o,'rgba(120,150,255,.55)',w*.8);line(a-nx*o,b-ny*o,c-nx*o,e-ny*o,'rgba(200,40,50,.6)',w*.8)}
  line(a,b,c,e,'rgba(250,240,225,.9)',Math.max(.9,s.w*.8*(1+.08*V)))});
 const[t0x,t0y]=T(259,28),[t1x,t1y]=T(259,150);line(t0x,t0y,t1x,t1y,'#efe3cc',13);
 for(let y=34;y<146;y+=7){const q=T(259,y);line(q[0]-6,q[1],q[0]+6,q[1],'rgba(120,90,60,.45)',1.2)}
 // alveolar clusters at tips
 const r=2.4*(1+.5*V);g.beginPath();leaves.forEach(id=>{const[x,y]=T(segs[id].x2,segs[id].y2);for(let k=0;k<5;k++){const a=k*1.256+id,rx=x+Math.cos(a)*r*.9,ry=y+Math.sin(a)*r*.9;g.moveTo(rx+r,ry);g.arc(rx,ry,r,0,6.29)}});
 g.fillStyle='rgba(255,225,232,.55)';g.fill();g.strokeStyle='rgba(200,30,50,.85)';g.lineWidth=.9;g.stroke();
 // flow particles
 P.forEach(p=>{const q=onPath(paths[p.i],p.dir>0?p.f:1-p.f);g.fillStyle=p.dir>0?'#7dd3fc':'#fbbf24';g.shadowColor=g.fillStyle;g.shadowBlur=8;g.beginPath();g.arc(q[0],q[1],2.6,0,6.29);g.fill()});g.shadowBlur=0;
 // labels
 [['Баруун уушиг',120,70],['Дээд дэлбээ',148,128],['Дунд дэлбээ',140,262],['Доод дэлбээ',160,420],['Зүүн уушиг',400,70],['Дээд дэлбээ',372,140],['Доод дэлбээ',360,420]].forEach(([s,x,y],i)=>{const q=T(x,y);txt(s,q[0],q[1],i%7==0||i==4?'#fde2e8':'rgba(255,255,255,.85)',i%7==0||i==4?11:9)});
 txt('Трахей',250,44,'#cbd5e1',11,'right');txt('ETT',270,22,'#f59e0b',9,'left');const hl=T(284,340);txt('Зүрх',hl[0],hl[1],'#ffd9df',10);
 
 txt('Артери (хүчилтөрөгчгүй)',60,530,'#8aa4ff',10,'left');txt('Вен (хүчилтөрөгчтэй)',60,546,'#f87171',10,'left');txt('Гуурсан хоолой',60,562,'#efe3cc',10,'left');
}
function drawAlv(dt,u){
 const cx=715,cy=170,R=58*S.ar*(1+.26*V);
 g.save();g.beginPath();g.roundRect(552,12,336,290,14);g.fillStyle='#0f1930';g.fill();g.strokeStyle='#2b3b5e';g.lineWidth=1;g.stroke();g.clip();
 txt('Альвеол ≈ '+S.ad+' мкм · нийт '+S.an,720,32,'#9fb3d1',11);
 // duct
 line(552,cy,cx-R,cy,'rgba(244,232,210,.25)',22);line(552,cy,cx-R,cy,'rgba(15,25,48,.9)',14);txt('Альвеолын сувгаар →',590,cy-18,'#8da0bd',9);
 // neighbours
 for(let k=0;k<5;k++){const a=-1.25+k*1.27,d=R+30+8*V,rn=26*(1+.22*V),x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d*.95;
  g.beginPath();g.arc(x,y,rn,0,6.29);g.fillStyle='rgba(255,150,175,.1)';g.fill();g.strokeStyle='rgba(255,150,175,.45)';g.lineWidth=2;g.stroke();
  g.beginPath();g.arc(x,y,rn+6,0,6.29);g.strokeStyle='rgba(200,40,60,.4)';g.lineWidth=5;g.setLineDash([6,5]);g.stroke();g.setLineDash([])}
 // main alveolus
 const gr=g.createRadialGradient(cx-10,cy-10,5,cx,cy,R);gr.addColorStop(0,'#16345a');gr.addColorStop(1,'#2d2447');
